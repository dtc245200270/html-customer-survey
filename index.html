<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market Research Survey</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .survey-container {
            background: #ffffff;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px 40px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            color: #333;
        }
        p.desc {
            color: #666;
            font-size: 14px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .field {
            margin-bottom: 20px;
        }
        label.field-title {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #222;
        }
        select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .options-list li {
            margin-bottom: 6px;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 8px;
            font-size: 13px;
        }
        .matrix-table th, .matrix-table td {
            border: 1px solid #e1e4e8;
            padding: 8px;
            text-align: center;
        }
        .matrix-table th:first-child, .matrix-table td:first-child {
            text-align: left;
        }
        .matrix-table th {
            background-color: #fafbfc;
        }
        .btn-submit {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

<div class="survey-container">
    <h2>Market Research Survey</h2>
    <p class="desc">Please take a few moments to complete this satisfaction survey.</p>

    <form action="#" method="POST">
        <div class="field">
            <label class="field-title">What is your age range?</label>
            <select name="age">
                <option value="18-24">18-24</option>
                <option value="25-34">25-34</option>
                <option value="35-50">35-50</option>
                <option value="50+">50+</option>
            </select>
        </div>

        <div class="field">
            <label class="field-title">What is your yearly household income?</label>
            <select name="income">
                <option value="0-25k">$0 - $25,000</option>
                <option value="25k-50k">$25,001 - $50,000</option>
                <option value="50k-100k">$50,001 - $100,000</option>
                <option value="100k+">$100,000+</option>
            </select>
        </div>

        <div class="field">
            <label class="field-title">Gender Identity</label>
            <ul class="options-list">
                <li><label><input type="radio" name="gender" value="male"> Male</label></li>
                <li><label><input type="radio" name="gender" value="female"> Female</label></li>
                <li><label><input type="radio" name="gender" value="nonbinary"> Nonbinary</label></li>
                <li><label><input type="radio" name="gender" value="other"> Other</label></li>
            </ul>
        </div>

        <div class="field">
            <label class="field-title">Which of the following products have you purchased in the last 2 months? (Check all that apply)</label>
            <ul class="options-list">
                <li><label><input type="checkbox" name="product" value="product1"> Product 1</label></li>
                <li><label><input type="checkbox" name="product" value="product2"> Product 2</label></li>
                <li><label><input type="checkbox" name="product" value="product3"> Product 3</label></li>
            </ul>
        </div>

        <div class="field">
            <label class="field-title">How often would you use our new product?</label>
            <ul class="options-list">
                <li><label><input type="radio" name="frequency" value="daily"> Daily</label></li>
                <li><label><input type="radio" name="frequency" value="weekly"> Weekly</label></li>
                <li><label><input type="radio" name="frequency" value="monthly"> Monthly</label></li>
            </ul>
        </div>

        <div class="field">
            <label class="field-title">What would you pay for the new product?</label>
            <table class="matrix-table">
                <thead>
                    <tr>
                        <th></th>
                        <th>Strongly Disagree</th>
                        <th>Disagree</th>
                        <th>Neutral</th>
                        <th>Agree</th>
                        <th>Strongly Agree</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Our products are priced fairly.</td>
                        <td><input type="radio" name="fair_price" value="1"></td>
                        <td><input type="radio" name="fair_price" value="2"></td>
                        <td><input type="radio" name="fair_price" value="3"></td>
                        <td><input type="radio" name="fair_price" value="4"></td>
                        <td><input type="radio" name="fair_price" value="5"></td>
                    </tr>
                    <tr>
                        <td>Our products are high quality.</td>
                        <td><input type="radio" name="quality" value="1"></td>
                        <td><input type="radio" name="quality" value="2"></td>
                        <td><input type="radio" name="quality" value="3"></td>
                        <td><input type="radio" name="quality" value="4"></td>
                        <td><input type="radio" name="quality" value="5"></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div class="field">
            <label class="field-title">Additional Comments</label>
            <textarea name="comments" rows="4" placeholder="Type here..."></textarea>
        </div>

        <button type="submit" class="btn-submit">Submit</button>
    </form>
</div>

</body>
</html>
